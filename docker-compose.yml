# OKOA AI — local development infrastructure
# Usage (from the repo root):
#   docker compose up -d db redis
# Service names are intentionally `db` and `redis` to match the README.

services:
  db:
    image: postgres:16-alpine
    container_name: okoa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: okoa
      POSTGRES_PASSWORD: okoa          # dev only — override via .env / secrets in staging+
      POSTGRES_DB: okoa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okoa -d okoa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: okoa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
